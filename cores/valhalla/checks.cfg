[options]
isa rv32im
nbus 1

[depth]
insn            15
reg       15    25
cover      1    25

[filter-checks]
# reg_ch0 (whole-register-file consistency) ran unbounded for 3+ hours
# without resolving before a 300s solver timeout was added -- genuinely
# hard or possibly divergent, not just slow. Excluded for now to get a
# real pass/fail signal on the per-instruction checks first; revisit
# reg_ch0 separately with a much larger time budget.
- reg.*

[cover]
always @* begin
    if (!reset) begin
        cover(rvfi_valid);
        cover(rvfi_valid && rvfi_insn[6:0] == 7'b0110011 &&
                           rvfi_insn[14:12] == 3'b000 &&
                           rvfi_insn[31:25] == 7'b0000000);
    end
end

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_NRET 1
`define RISCV_FORMAL_XLEN 32
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@basedir@/../src/verification/wrapper_formal.v
@basedir@/../build/rvfi_wrapper.v